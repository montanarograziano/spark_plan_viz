name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Step 1: Run tests first
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  # Step 2: Determine version bump and create release
  release:
    name: Semantic Release
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false

    permissions:
      contents: write

    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Required so the subsequent release commit/tag can push back to main.
          persist-credentials: true

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      # Run the CLI ourselves instead of the official Docker action.
      # GitPython 3.1.60 removed Actor.name_email_regex, which breaks every PSR
      # config load (incl. the action image that resolves GitPython at build time).
      # Pin GitPython until upstream merges:
      # https://github.com/python-semantic-release/python-semantic-release/issues/1476
      - name: Install python-semantic-release
        run: |
          uv tool install "python-semantic-release==10.5.3" \
            --with "gitpython>=3.1.0,<3.1.60"

      - name: Configure git author
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Semantic Release — version, tag, push
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
        run: |
          # PSR writes released/version/tag to $GITHUB_OUTPUT when running in Actions.
          semantic-release -v version --no-changelog

      - name: Upload build artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Step 3: Generate changelog with git-cliff and update GitHub Release
  changelog:
    name: Generate Changelog
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4.6.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Update GitHub Release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          body_path: CHANGES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 4: Publish to PyPI
  publish-to-pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
